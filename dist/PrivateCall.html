/* PrivateCall — plain, conventional desktop-utility styling.
   System font, neutral colours, ordinary buttons, no decoration.

:root {
  --bg: #ffffff;
  --text: #202124;
  --muted: #5f6368;
  --border: #c4c7cc;
  --panel: #f3f4f5;

}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
[hidden] { display: none !important; }

.link:hover { color: var(--primary-hover); }

.verify {
  position: absolute; z-index: 5; inset-inline: 0; top: 1rem; margin: 0 auto; width: min(32rem, calc(100% - 2rem));

  padding: 1rem 1.25rem; background: #fff; color: var(--text); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);

.verify-code { display: flex; gap: 0.75rem; font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.05em; direction: ltr; }

.verify-steps { margin: 0; padding-inline-start: 1.3rem; display: grid; gap: 0.25rem; }

.note { font-size: 0.875rem; color: var(--muted); }
.note-ok { color: var(--ok); }

.self-view { position: absolute; inset-inline-end: 1rem; bottom: 1rem; z-index: 3; width: clamp(8rem, 18vw, 13rem); aspect-ratio: 4 / 3; background: #2a2c2f; border: 1px solid #44474b; border-radius: var(--radius); overflow: hidden; }
.self-off { position: absolute; inset: 0; display: grid; place-items: center; color: var(--call-muted); font-size: 0.8125rem; }
.self-label { position: absolute; inset-inline-start: 0; bottom: 0; padding: 0.1rem 0.4rem; background: rgba(0, 0, 0, 0.65); color: #fff; font-size: 0.75rem; }
.self-label-end { inset-inline-start: auto; inset-inline-end: 0; }

.controls { display: flex; justify-content: center; gap: 0.5rem; padding: 0.75rem 1rem; background: var(--call-panel); }
.ctl { display: inline-flex; align-items: center; gap: 0.4rem; min-height: 2.5rem; padding: 0.35rem 1rem; border: 1px solid #5f6368; border-radius: var(--radius); background: #3c4043; color: #fff; cursor: pointer; }
.ctl:hover { background: #4a4e52; }
.ctl[aria-pressed="false"] { background: #e8eaed; color: var(--text); border-color: #e8eaed; }

.ctl-leave:hover { background: #8f1e18; }
.ic { width: 1.15rem; height: 1.15rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- ended ---------- */
#ended-card.is-danger #ended-title { color: var(--danger); }

.ended-tips ul { margin: 0; padding-inline-start: 1.3rem; }
.ended-diag { color: var(--muted); font-size: 0.875rem; }
.ended-duration { color: var(--muted); }

/* ---------- dialogs ---------- */
.dialog { width: min(32rem, calc(100% - 2rem)); max-height: calc(100% - 2rem); padding: 0; border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); }

.build-id { font-size: 0.8125rem; color: var(--muted); }

.details dt { color: var(--muted); }
.details dd { margin: 0; overflow-wrap: anywhere; }
.details dd.mono { font: 0.75rem/1.4 ui-monospace, Consolas, monospace; }

.toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 50; max-width: min(30rem, calc(100% - 2rem)); padding: 0.6rem 0.9rem; border-radius: var(--radius); background: #202124; color: #fff; }

<div class="app" id="app">

  </header>

  <main id="main">
    <!-- Welcome -->
    <section class="screen screen-welcome" id="screen-welcome" aria-labelledby="welcome-title" hidden>
      <div class="page">
        <h1 id="welcome-title" data-i18n="welcome.title"></h1>

    <!-- Start a call -->
    <section class="screen screen-setup" id="screen-start" aria-labelledby="start-title" hidden>

              <p class="step-hint" data-i18n="start.step1Hint"></p>
              <div class="step-body">

                  <div class="btn-row">
                    <button type="button" class="btn" id="invite-paste"><span data-i18n="common.paste"></span></button>

<script>
(() => {
'use strict';
// ---- util.js ----
// Small, dependency-free helpers shared by the core modules.
// Everything here works both in browsers and in Node >= 20 (used by unit tests).

const textEncoder = new TextEncoder();
const textDecoderStrict = new TextDecoder('utf-8', { fatal: true });

function utf8Encode(str) {
  return textEncoder.encode(str);
}

function utf8Decode(bytes) {
  return textDecoderStrict.decode(bytes);
}

function randomBytes(n) {
  const out = new Uint8Array(n);
  crypto.getRandomValues(out);
  return out;
}

async function sha256(bytes) {
  return new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
}

function concatBytes(...parts) {
  let len = 0;
  for (const p of parts) len += p.length;
  const out = new Uint8Array(len);
  let off = 0;
  for (const p of parts) {
    out.set(p, off);
    off += p.length;
  }
  return out;
}

// Unambiguous encoding of a list of byte strings: 4-byte big-endian length + bytes.
// Used for every hash input so that field boundaries cannot be shifted.
function lengthPrefixed(fields) {
  const parts = [];
  for (const f of fields) {
    const bytes = typeof f === 'string' ? utf8Encode(f) : f;
    const len = new Uint8Array(4);
    new DataView(len.buffer).setUint32(0, bytes.length, false);
    parts.push(len, bytes);
  }
  return concatBytes(...parts);
}

function bytesEqual(a, b) {
  if (!(a instanceof Uint8Array) || !(b instanceof Uint8Array)) return false;
  if (a.length !== b.length) return false;
  let diff = 0;
  for (let i = 0; i < a.length; i++) diff |= a[i] ^ b[i];
  return diff === 0;
}

const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
const B64URL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

function makeReverse(alphabet) {
  const rev = new Int16Array(128).fill(-1);
  for (let i = 0; i < alphabet.length; i++) rev[alphabet.charCodeAt(i)] = i;
  return rev;
}
const B64_REV = makeReverse(B64);
const B64URL_REV = makeReverse(B64URL);

function encodeWith(bytes, alphabet) {
  let out = '';
  let i = 0;
  for (; i + 2 < bytes.length; i += 3) {
    const n = (bytes[i] << 16) | (bytes[i + 1] << 8) | bytes[i + 2];
    out += alphabet[(n >> 18) & 63] + alphabet[(n >> 12) & 63] + alphabet[(n >> 6) & 63] + alphabet[n & 63];
  }
  const rem = bytes.length - i;
  if (rem === 1) {
    const n = bytes[i] << 16;
    out += alphabet[(n >> 18) & 63] + alphabet[(n >> 12) & 63];
  } else if (rem === 2) {
    const n = (bytes[i] << 16) | (bytes[i + 1] << 8);
    out += alphabet[(n >> 18) & 63] + alphabet[(n >> 12) & 63] + alphabet[(n >> 6) & 63];
  }
  return out; // unpadded
}

// Strict decoder: rejects any character outside the alphabet, rejects impossible
// lengths and non-zero trailing bits (so each byte string has one encoding).
function decodeWith(str, rev) {
  if (str.length % 4 === 1) return null;
  const outLen = Math.floor((str.length * 3) / 4);
  const out = new Uint8Array(outLen);
  let o = 0;
  let acc = 0;
  let bits = 0;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    const v = c < 128 ? rev[c] : -1;
    if (v < 0) return null;
    acc = (acc << 6) | v;
    bits += 6;
    if (bits >= 8) {
      bits -= 8;
      out[o++] = (acc >> bits) & 0xff;
    }
    acc &= (1 << bits) - 1;
  }
  if (acc !== 0) return null; // non-canonical trailing bits
  return out;
}

function base64Encode(bytes) {
  return encodeWith(bytes, B64);
}
function base64Decode(str) {
  return decodeWith(str, B64_REV);
}
function base64urlEncode(bytes) {
  return encodeWith(bytes, B64URL);
}
function base64urlDecode(str) {
  return decodeWith(str, B64URL_REV);
}

function hexToBytes(hex) {
  if (typeof hex !== 'string' || hex.length % 2 !== 0 || !/^[0-9a-fA-F]*$/.test(hex)) return null;
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}

function wipe(bytes) {
  if (bytes instanceof Uint8Array) bytes.fill(0);
}

// Deflate (raw) with a hard cap on the decompressed size, so a crafted payload
// cannot expand into a large allocation ("zip bomb").
async function deflateRaw(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function inflateRawLimited(bytes, maxOut) {
  const ds = new DecompressionStream('deflate-raw');
  const writer = ds.writable.getWriter();
  const reader = ds.readable.getReader();
  // Errors surface on the reader; swallow the writer-side duplicates.
  writer.write(bytes).catch(() => {});
  writer.close().catch(() => {});
  const chunks = [];
  let total = 0;
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      total += value.length;
      if (total > maxOut) {
        reader.cancel().catch(() => {});
        return { ok: false, reason: 'too-large' };
      }
      chunks.push(value);
    }
  } catch {
    return { ok: false, reason: 'corrupt' };
  }
  return { ok: true, bytes: concatBytes(...chunks) };
}

// ---- codec.js ----
// Text "envelope" for invitations and replies.
//
// People move these through chat apps and email, which re-wrap lines, add
// quote markers, or apply formatting. The envelope is designed to survive that:
//   * standard base64 alphabet (A-Z a-z 0-9 + /): no "_", "*", "~", "`" that chat
//     apps interpret as formatting;
//   * whitespace, ">" quote markers and invisible characters are ignored;
//   * a checksum detects truncation and accidental corruption.
// The checksum is NOT a security mechanism (anyone can recompute it). Protection
// against deliberate tampering comes from the security-code check (see sas.js).



const PROTOCOL_VERSION = 1;
const LIMITS = {
  text: 40000, // characters accepted from paste / file
  binary: 24000, // decoded envelope bytes
  json: 32000, // decompressed JSON bytes
  file: 64 * 1024, // bytes accepted from a dropped / opened file
};

const MAGIC = [0x50, 0x43]; // "PC"
const KIND_CODES = { invite: 1, reply: 2 };
const KIND_NAMES = { 1: 'invite', 2: 'reply' };
const FLAG_DEFLATE = 1;
const CHECKSUM_LEN = 8;
const LINE = 64;

const MARKER_RE = /PrivateCall[.](invite|reply)[.]v(\d{1,3}):/gi;
const END_MARK = ':end';

async function encodeEnvelope(kind, payloadObj, introText) {
  const code = KIND_CODES[kind];
  if (!code) throw new Error('bad kind');
  const json = utf8Encode(JSON.stringify(payloadObj));
  if (json.length > LIMITS.json) throw new Error('payload too large');
  let body = json;
  let flags = 0;
  if (typeof CompressionStream === 'function') {
    body = await deflateRaw(json);
    flags |= FLAG_DEFLATE;
  }
  const head = new Uint8Array([...MAGIC, PROTOCOL_VERSION, code, flags]);
  const unsummed = concatBytes(head, body);
  const sum = (await sha256(unsummed)).slice(0, CHECKSUM_LEN);
  const b64 = base64Encode(concatBytes(unsummed, sum));
  const lines = [];
  for (let i = 0; i < b64.length; i += LINE) lines.push(b64.slice(i, i + LINE));
  const block = `PrivateCall.${kind}.v${PROTOCOL_VERSION}:\n${lines.join('\n')}\n${END_MARK}`;
  return introText ? `${introText}\n\n${block}\n` : `${block}\n`;
}

// Returns { ok: true, kind, version, payload } or { ok: false, error }.
// Error codes are mapped to friendly messages by the UI.
async function decodeEnvelope(text) {
  if (typeof text !== 'string' || text.trim() === '') return { ok: false, error: 'empty' };
  if (text.length > LIMITS.text) return { ok: false, error: 'too-large' };

  MARKER_RE.lastIndex = 0;
  const matches = [...text.matchAll(MARKER_RE)];
  if (matches.length === 0) {
    if (/^\s*PCRELAY/i.test(text)) return { ok: false, error: 'is-relay-code' };
    return { ok: false, error: 'not-found' };
  }
  if (matches.length > 1) return { ok: false, error: 'multiple' };
  const m = matches[0];
  const kind = m[1].toLowerCase();
  const version = Number(m[2]);
  const start = m.index + m[0].length;
  const endIdx = text.toLowerCase().indexOf(END_MARK, start);
  if (endIdx < 0) return { ok: false, error: 'incomplete', kind };
  if (version !== PROTOCOL_VERSION) {
    return { ok: false, error: version > PROTOCOL_VERSION ? 'version-newer' : 'version-older', kind };
  }

  // Ignore line breaks, spaces, quote markers and invisible formatting characters.
  const raw = text
    .slice(start, endIdx)
    .replace(/[\s>\u200b-\u200f\u2028\u2029\u2060\ufeff]/g, '');
  if (!/^[A-Za-z0-9+/]*$/.test(raw)) return { ok: false, error: 'corrupt', kind };
  const bin = base64Decode(raw);
  if (!bin) return { ok: false, error: 'corrupt', kind };
  if (bin.length > LIMITS.binary) return { ok: false, error: 'too-large', kind };
  if (bin.length < 5 + CHECKSUM_LEN) return { ok: false, error: 'incomplete', kind };

  const unsummed = bin.subarray(0, bin.length - CHECKSUM_LEN);
  const sum = bin.subarray(bin.length - CHECKSUM_LEN);
  const expect = (await sha256(unsummed)).slice(0, CHECKSUM_LEN);
  if (!bytesEqual(sum, expect)) return { ok: false, error: 'corrupt', kind };

  if (bin[0] !== MAGIC[0] || bin[1] !== MAGIC[1]) return { ok: false, error: 'corrupt', kind };
  if (bin[2] !== PROTOCOL_VERSION) return { ok: false, error: 'corrupt', kind };
  if (KIND_NAMES[bin[3]] !== kind) return { ok: false, error: 'corrupt', kind };
  const flags = bin[4];
  if (flags & ~FLAG_DEFLATE) return { ok: false, error: 'corrupt', kind };

  let jsonBytes = unsummed.subarray(5);
  if (flags & FLAG_DEFLATE) {
    if (typeof DecompressionStream !== 'function') return { ok: false, error: 'browser-unsupported', kind };
    const r = await inflateRawLimited(jsonBytes, LIMITS.json);
    if (!r.ok) return { ok: false, error: r.reason === 'too-large' ? 'too-large' : 'corrupt', kind };
    jsonBytes = r.bytes;
  } else if (jsonBytes.length > LIMITS.json) {
    return { ok: false, error: 'too-large', kind };
  }

  let payload;
  try {
    payload = JSON.parse(utf8Decode(jsonBytes));
  } catch {
    return { ok: false, error: 'corrupt', kind };
  }
  return { ok: true, kind, version, payload };
}

// ---- sdp.js ----
// Defensive inspection of SDP received from the other person.
//
// We never "munge" SDP. We only check that it is well-formed for what this app
// generates, and extract the DTLS certificate fingerprint that the browser will
// enforce during the DTLS handshake. That fingerprint is what the security code
// (SAS) is computed over, so it must be unambiguous: exactly one fingerprint,
// identical on every media section.

const SDP_MAX_LENGTH = 20000;
const FP_ALGS = { 'sha-256': 32, 'sha-384': 48, 'sha-512': 64 };

function inspectSdp(sdp, type) {
  const fail = (code) => ({ ok: false, error: code });
  if (typeof sdp !== 'string') return fail('sdp-type');
  if (sdp.length < 20 || sdp.length > SDP_MAX_LENGTH) return fail('sdp-size');
  // Printable ASCII and CRLF only.
  if (!/^[\x20-\x7e\r\n]*$/.test(sdp)) return fail('sdp-charset');
  if (!sdp.startsWith('v=0\r\n')) return fail('sdp-start');
  if (!sdp.endsWith('\r\n')) return fail('sdp-end');

  const lines = sdp.slice(0, -2).split('\r\n');
  const fingerprints = new Set();
  const setups = new Set();
  const kinds = [];
  const candidates = [];
  let ufrag = null;
  let pwd = null;

  for (const line of lines) {
    if (!/^[a-z]=/.test(line)) return fail('sdp-line');
    if (line.includes('\r') || line.includes('\n')) return fail('sdp-line');
    if (line.startsWith('m=')) {
      const m = /^m=(audio|video|application) \d+ [A-Z/]+( [\w-]+)+$/.exec(line);
      if (!m) return fail('sdp-media');
      kinds.push(m[1]);
    } else if (line.startsWith('a=fingerprint:')) {
      const m = /^a=fingerprint:(\S+) ([0-9A-Fa-f]{2}(?::[0-9A-Fa-f]{2})+)$/.exec(line);
      if (!m) return fail('sdp-fingerprint');
      const alg = m[1].toLowerCase();
      const value = m[2].toUpperCase();
      if (!(alg in FP_ALGS)) return fail('sdp-fingerprint-alg');
      if (value.split(':').length !== FP_ALGS[alg]) return fail('sdp-fingerprint');
      fingerprints.add(alg + ' ' + value);
    } else if (line.startsWith('a=setup:')) {
      setups.add(line.slice(8));
    } else if (line.startsWith('a=ice-ufrag:')) {
      const v = line.slice(12);
      if (ufrag !== null && ufrag !== v) return fail('sdp-ice');
      ufrag = v;
    } else if (line.startsWith('a=ice-pwd:')) {
      const v = line.slice(10);
      if (pwd !== null && pwd !== v) return fail('sdp-ice');
      pwd = v;
    } else if (line.startsWith('a=candidate:')) {
      const c = parseCandidate(line.slice(2));
      if (c) candidates.push(c);
    }
  }

  // This app always negotiates exactly one audio, one video and one data section.
  const sorted = [...kinds].sort().join(',');
  if (sorted !== 'application,audio,video') return fail('sdp-media');
  if (fingerprints.size !== 1) return fail('sdp-fingerprint-count');
  if (setups.size !== 1) return fail('sdp-setup');
  const setup = [...setups][0];
  if (type === 'offer' && setup !== 'actpass') return fail('sdp-setup');
  if (type === 'answer' && setup !== 'active' && setup !== 'passive') return fail('sdp-setup');
  if (!ufrag || !pwd || !/^[A-Za-z0-9+/]{4,256}$/.test(ufrag) || !/^[A-Za-z0-9+/]{22,256}$/.test(pwd)) {
    return fail('sdp-ice');
  }

  const [alg, value] = [...fingerprints][0].split(' ');
  return { ok: true, fingerprint: { alg, value }, setup, candidates };
}

// Minimal candidate parser for diagnostics only; never used for security decisions.
function parseCandidate(str) {
  const m = /^candidate:\S+ \d+ (udp|tcp) \d+ (\S+) (\d+) typ (host|srflx|prflx|relay)/i.exec(str);
  if (!m) return null;
  return { protocol: m[1].toLowerCase(), address: m[2], port: Number(m[3]), type: m[4].toLowerCase() };
}

function summarizeCandidates(candidates) {
  const s = { host: 0, srflx: 0, relay: 0, prflx: 0, mdns: 0, tcp: 0 };
  for (const c of candidates) {
    s[c.type] = (s[c.type] || 0) + 1;
    if (c.address.endsWith('.local')) s.mdns++;
    if (c.protocol === 'tcp') s.tcp++;
  }
  return s;
}

// Canonical byte form of a fingerprint for hashing: "sha-256 AB:CD:...".
function fingerprintString(fp) {
  return fp.alg.toLowerCase() + ' ' + fp.value.toUpperCase();
}

function normalizeStatsFingerprint(alg, value) {
  if (typeof alg !== 'string' || typeof value !== 'string') return null;
  return alg.toLowerCase() + ' ' + value.toUpperCase();
}

// Separate the remote candidates from an SDP so they can be supplied (and
// re-supplied) with the standard addIceCandidate() API. Candidates are
// de-duplicated by transport address and attached to the first BUNDLE mid,
// which carries the single shared transport (bundlePolicy: max-bundle).
function splitCandidates(sdp) {
  const lines = sdp.slice(0, -2).split('\r\n');
  const bundle = lines.find((l) => l.startsWith('a=group:BUNDLE '));
  let currentMid = null;
  const firstMid = bundle ? bundle.split(' ')[1] : null;
  const seen = new Set();
  const candidates = [];
  const kept = [];
  for (const line of lines) {
    if (line.startsWith('m=')) currentMid = null;
    if (line.startsWith('a=mid:')) currentMid = line.slice(6);
    if (line.startsWith('a=candidate:')) {
      const c = parseCandidate(line.slice(2));
      const key = c ? `${c.protocol} ${c.address} ${c.port} ${c.type}` : line;
      if (!seen.has(key)) {
        seen.add(key);
        candidates.push({ candidate: line.slice(2), sdpMid: firstMid || currentMid || '0' });
      }
      continue;
    }
    if (line === 'a=end-of-candidates') continue;
    kept.push(line);
  }
  return { sdp: kept.join('\r\n') + '\r\n', candidates };
}

// A copy of a candidate with a different foundation. Re-adding the same address
// under a new foundation makes the ICE agent start fresh connectivity checks,
// which keeps this side's router "pinhole" toward the other side open while
// waiting for them to add the reply (see session.js: refreshRemoteCandidates).
function refreshFoundation(candidate, round) {
  return candidate.replace(/^candidate:([A-Za-z0-9+/]{1,32})/, (m, f) => `candidate:${f.slice(0, 24)}r${round}`);
}

// ---- protocol.js ----
// Strict schemas for everything received from the other side: the invitation,
// the reply, and the small control messages sent over the encrypted data channel.
// Unknown or extra fields are rejected rather than ignored.





const SID_BYTES = 16;
const NONCE_BYTES = 32;
const COMMIT_BYTES = 32;

function exactKeys(obj, keys) {
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return false;
  const k = Object.keys(obj);
  return k.length === keys.length && keys.every((x) => Object.prototype.hasOwnProperty.call(obj, x));
}

function b64Field(v, len) {
  if (typeof v !== 'string' || v.length > 64) return null;
  const b = base64urlDecode(v);
  return b && b.length === len ? b : null;
}

function validTimestamp(ts) {
  return Number.isSafeInteger(ts) && ts > 1.6e9 && ts < 1e10;
}

// Invitation (offer) payload.
function parseInvite(p) {
  if (!exactKeys(p, ['v', 'sid', 'ts', 'media', 'commit', 'sdp'])) return { ok: false, error: 'schema' };
  if (p.v !== PROTOCOL_VERSION) return { ok: false, error: 'schema' };
  const sid = b64Field(p.sid, SID_BYTES);
  const commit = b64Field(p.commit, COMMIT_BYTES);
  if (!sid || !commit) return { ok: false, error: 'schema' };
  if (!validTimestamp(p.ts)) return { ok: false, error: 'schema' };
  if (p.media !== 'video' && p.media !== 'audio') return { ok: false, error: 'schema' };
  const sdpInfo = inspectSdp(p.sdp, 'offer');
  if (!sdpInfo.ok) return { ok: false, error: 'sdp', detail: sdpInfo.error };
  return { ok: true, sid, sidText: p.sid, ts: p.ts, media: p.media, commit, sdp: p.sdp, sdpInfo };
}

// Reply (answer) payload.
function parseReply(p) {
  if (!exactKeys(p, ['v', 'sid', 'ts', 'nb', 'sdp'])) return { ok: false, error: 'schema' };
  if (p.v !== PROTOCOL_VERSION) return { ok: false, error: 'schema' };
  const sid = b64Field(p.sid, SID_BYTES);
  const nb = b64Field(p.nb, NONCE_BYTES);
  if (!sid || !nb) return { ok: false, error: 'schema' };
  if (!validTimestamp(p.ts)) return { ok: false, error: 'schema' };
  const sdpInfo = inspectSdp(p.sdp, 'answer');
  if (!sdpInfo.ok) return { ok: false, error: 'sdp', detail: sdpInfo.error };
  return { ok: true, sid, sidText: p.sid, ts: p.ts, nb, sdp: p.sdp, sdpInfo };
}

const CONTROL_MAX_BYTES = 512;

// Control messages over the data channel (already inside DTLS).
function parseControl(data) {
  if (typeof data !== 'string' || data.length > CONTROL_MAX_BYTES) return null;
  let m;
  try {
    m = JSON.parse(data);
  } catch {
    return null;
  }
  if (!m || typeof m !== 'object' || Array.isArray(m)) return null;
  switch (m.t) {
    case 'reveal': {
      if (!exactKeys(m, ['t', 'na'])) return null;
      const na = b64Field(m.na, NONCE_BYTES);
      return na ? { t: 'reveal', na } : null;
    }
    case 'state':
      if (!exactKeys(m, ['t', 'mic', 'cam'])) return null;
      if (typeof m.mic !== 'boolean' || typeof m.cam !== 'boolean') return null;
      return { t: 'state', mic: m.mic, cam: m.cam };
    case 'confirmed':
    case 'bye':
      return exactKeys(m, ['t']) ? { t: m.t } : null;
    default:
      return null;
  }
}

const SIZES = { SID_BYTES, NONCE_BYTES };

// ---- sas.js ----
// Short Authentication String (security code) protocol.
//
// Goal: detect a "person in the middle" who swapped the DTLS certificates in the
// invitation and/or reply. This follows the commit-then-reveal idea of ZRTP
// (RFC 6189) adapted to WebRTC's DTLS-SRTP:
//
//   Invitation (offer):  sid, commit = H("commit", sid, nA), offer SDP (cert fpO)
//   Reply (answer):      sid, nB, answer SDP (cert fpA)
//   After DTLS is up:    offerer reveals nA over the encrypted data channel;
//                        answerer checks H(nA) == commit.
//   Both show:           code = H("sas", sid, fpO, fpA, nA, nB) as 6 digits.
//
// An attacker who substitutes certificates must commit to every value it sends
// before learning nA (nA is hidden in the commitment until the DTLS sessions,
// and therefore the certificates, are fixed). So it cannot search for
// certificates that make both sides display the same code: the two codes match
// by chance with probability about 1 in 1,000,000 per attempt, and each attempt
// is a visible call that the users must accept.
//
// The code proves "no one is in the middle of THIS call". It does not prove who
// the other person is; people do that by recognising each other.




const COMMIT_LABEL = 'PrivateCall commit v1';
const SAS_LABEL = 'PrivateCall SAS v1';
const SAS_DIGITS = 6;

async function makeCommit(sid, nonceA) {
  return sha256(lengthPrefixed([COMMIT_LABEL, sid, nonceA]));
}

async function checkCommit(sid, nonceA, commit) {
  return bytesEqual(await makeCommit(sid, nonceA), commit);
}

async function deriveSas({ sid, offerFingerprint, answerFingerprint, nonceA, nonceB }) {
  const h = await sha256(
    lengthPrefixed([
      SAS_LABEL,
      sid,
      fingerprintString(offerFingerprint),
      fingerprintString(answerFingerprint),
      nonceA,
      nonceB,
    ]),
  );
  // 64 bits reduced mod 10^6: bias is below 2^-44, negligible.
  let n = 0n;
  for (let i = 0; i < 8; i++) n = (n << 8n) | BigInt(h[i]);
  return (n % 10n ** BigInt(SAS_DIGITS)).toString().padStart(SAS_DIGITS, '0');
}

// ---- ice.js ----
// Network path configuration: public STUN helpers and optional user-supplied relay.
//
// STUN servers only tell each computer its public address; they never see call
// content, but they do learn that this IP address is starting a call, and when.
// A relay (TURN) forwards the encrypted media when a direct path is impossible.
// No relay credentials are built into the app: a relay operator gives users a
// short-lived "relay code" (see tools/make-relay-code.mjs).



const DEFAULT_STUN = ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'];

function buildIceConfig(settings) {
  const iceServers = [];
  const relayOnly = !!(settings.relay && settings.relayOnly);
  // In relay-only mode public STUN servers are useless (their results are never
  // offered), so they are not contacted at all: one fewer party learns of the call.
  if (settings.useStun && !relayOnly) iceServers.push({ urls: DEFAULT_STUN.slice() });
  if (settings.relay) {
    iceServers.push({
      urls: settings.relay.urls.slice(),
      username: settings.relay.username,
      credential: settings.relay.credential,
    });
  }
  return {
    iceServers,
    iceTransportPolicy: relayOnly ? 'relay' : 'all',
    bundlePolicy: 'max-bundle',
    rtcpMuxPolicy: 'require',
    iceCandidatePoolSize: 0,
  };
}

const RELAY_PREFIX = 'PCRELAY1:';

// Relay code: "PCRELAY1:" + base64 (unpadded, standard alphabet)(JSON {u: [urls], n: username, c: credential, e: expiry, l?: label})
function parseRelayCode(text, nowSec = Math.floor(Date.now() / 1000)) {
  if (typeof text !== 'string') return { ok: false, error: 'relay-invalid' };
  const t = text.replace(/\s+/g, '');
  if (t.length > 2000 || !t.toUpperCase().startsWith(RELAY_PREFIX)) return { ok: false, error: 'relay-invalid' };
  const bytes = base64Decode(t.slice(RELAY_PREFIX.length));
  if (!bytes) return { ok: false, error: 'relay-invalid' };
  let o;
  try {
    o = JSON.parse(utf8Decode(bytes));
  } catch {
    return { ok: false, error: 'relay-invalid' };
  }
  if (!o || typeof o !== 'object' || Array.isArray(o)) return { ok: false, error: 'relay-invalid' };
  const allowed = new Set(['u', 'n', 'c', 'e', 'l']);
  if (Object.keys(o).some((k) => !allowed.has(k))) return { ok: false, error: 'relay-invalid' };
  if (!Array.isArray(o.u) || o.u.length < 1 || o.u.length > 4) return { ok: false, error: 'relay-invalid' };
  for (const u of o.u) {
    if (typeof u !== 'string' || u.length > 256) return { ok: false, error: 'relay-invalid' };
    // turn:host[:port][?transport=udp|tcp] or turns:host[:port][?transport=tcp]
    if (!/^turns?:[A-Za-z0-9.\-[\]:]+(\?transport=(udp|tcp))?$/.test(u)) return { ok: false, error: 'relay-invalid' };
  }
  if (typeof o.n !== 'string' || o.n.length < 1 || o.n.length > 256) return { ok: false, error: 'relay-invalid' };
  if (typeof o.c !== 'string' || o.c.length < 1 || o.c.length > 256) return { ok: false, error: 'relay-invalid' };
  if (!Number.isSafeInteger(o.e)) return { ok: false, error: 'relay-invalid' };
  if (o.l !== undefined && (typeof o.l !== 'string' || o.l.length > 60)) return { ok: false, error: 'relay-invalid' };
  if (o.e <= nowSec) return { ok: false, error: 'relay-expired' };
  return {
    ok: true,
    relay: { urls: o.u, username: o.n, credential: o.c, expires: o.e, label: o.l || '' },
  };
}

// ---- gather.js ----
// When to stop collecting network candidates (non-trickle ICE).
//
// Because the invitation and reply are each sent once, any candidate gathered
// after the message is produced is lost for this call. Reliability therefore
// comes first: we wait for the browser to report gathering "complete".
//
// Measured in the network lab (Chromium 153, see docs/TESTING.md): with reachable
// STUN/TURN servers, gathering completes in ~0.1-0.2 s, so waiting costs nothing.
// It is only slow when a server is unreachable: ~26 s when its DNS name cannot be
// resolved, ~40 s when UDP is blocked. Waiting that long cannot produce candidates
// from an unreachable server, so after a generous minimum we stop once no new
// candidate has appeared for a while -- but never while a configured relay
// (the fallback that makes restrictive networks work) is still being contacted,
// when the browser lets us tell which server each result came from.

const GATHER_POLICY = {
  minMs: 15000, // never stop before this unless gathering is complete
  quietMs: 4000, // ...and only after this long without a new candidate
  maxMs: 30000, // hard cap: an invitation must eventually be produced
};

// state: {
//   elapsedMs, msSinceLastCandidate, complete,
//   relayUrls: string[]            relay (TURN) URLs configured
//   settledRelayUrls: Set<string>  relay URLs that produced a candidate or an error
//   attribution: boolean           browser reports which server a result came from
//   haveRelayCandidate: boolean    at least one relay candidate was gathered
// }
// returns { done: boolean, reason }
function gatherDecision(state, policy = GATHER_POLICY) {
  if (state.complete) return { done: true, reason: 'complete' };
  if (state.elapsedMs >= policy.maxMs) return { done: true, reason: 'cap' };
  if (state.elapsedMs < policy.minMs) return { done: false, reason: 'min' };
  if (state.msSinceLastCandidate < policy.quietMs) return { done: false, reason: 'active' };
  // A relay is the fallback that makes restrictive networks work. Until we hold a
  // relay candidate, keep waiting for any relay URL that has not answered yet.
  // Once we hold one, other relay transports (UDP/TCP/TLS to the same relay) add
  // no new reachability: all relay candidates are the relay's public address.
  if (state.relayUrls.length > 0 && state.attribution && !state.haveRelayCandidate) {
    const pending = state.relayUrls.filter((u) => !state.settledRelayUrls.has(u));
    if (pending.length > 0) return { done: false, reason: 'relay-pending' };
  }
  return { done: true, reason: 'quiet' };
}

function relayUrlsOf(iceConfig) {
  const out = [];
  for (const s of iceConfig.iceServers || []) {
    for (const u of [].concat(s.urls)) if (/^turns?:/i.test(u)) out.push(u);
  }
  return out;
}

// ---- media.js ----
// Camera and microphone handling. Devices are only ever opened after an explicit
// click, and every track this module opens is stopped by stopStream().

const AUDIO_CONSTRAINTS = {
  echoCancellation: true,
  noiseSuppression: true,
  autoGainControl: true,
  channelCount: 1,
};

// 720p is a ceiling, not a target: the browser's congestion control lowers
// resolution and frame rate automatically on weak connections.
const VIDEO_CONSTRAINTS = {
  width: { ideal: 1280 },
  height: { ideal: 720 },
  frameRate: { ideal: 30, max: 30 },
  facingMode: 'user',
};

function mediaSupport() {
  return {
    rtc: typeof RTCPeerConnection === 'function',
    gum: !!(typeof navigator !== 'undefined' && navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
    secure: typeof isSecureContext === 'undefined' ? true : isSecureContext,
    crypto: !!(globalThis.crypto && crypto.subtle),
    compression: deflateRawSupported(),
    certificates: typeof RTCPeerConnection === 'function' && typeof RTCPeerConnection.generateCertificate === 'function',
  };
}

// 'deflate-raw' arrived later than CompressionStream itself (Chrome 103, Firefox 113),
// so construct it rather than only checking that the class exists.
function deflateRawSupported() {
  try {
    new CompressionStream('deflate-raw');
    new DecompressionStream('deflate-raw');
    return true;
  } catch {
    return false;
  }
}

function classifyMediaError(err) {
  const name = err && err.name;
  switch (name) {
    case 'NotAllowedError':
    case 'SecurityError':
    case 'PermissionDeniedError':
      return 'permission-denied';
    case 'NotFoundError':
    case 'DevicesNotFoundError':
    case 'OverconstrainedError':
      return 'not-found';
    case 'NotReadableError':
    case 'TrackStartError':
    case 'AbortError':
      return 'in-use';
    default:
      return 'unknown';
  }
}

// Opens the microphone (required) and optionally the camera.
// If only the camera fails, returns an audio-only stream and a notice code.
async function openLocalMedia(wantVideo) {
  const md = navigator.mediaDevices;
  if (wantVideo) {
    try {
      const stream = await md.getUserMedia({ audio: AUDIO_CONSTRAINTS, video: VIDEO_CONSTRAINTS });
      return { ok: true, stream, notice: null };
    } catch (err) {
      const kind = classifyMediaError(err);
      if (kind === 'permission-denied') return { ok: false, error: 'permission-denied' };
      // Fall through: maybe only the camera is missing or busy.
      try {
        const stream = await md.getUserMedia({ audio: AUDIO_CONSTRAINTS });
        return { ok: true, stream, notice: kind === 'in-use' ? 'camera-busy' : 'camera-missing' };
      } catch (err2) {
        return { ok: false, error: classifyMediaError(err2) };
      }
    }
  }
  try {
    const stream = await md.getUserMedia({ audio: AUDIO_CONSTRAINTS });
    return { ok: true, stream, notice: null };
  } catch (err) {
    return { ok: false, error: classifyMediaError(err) };
  }
}

async function openCamera() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: VIDEO_CONSTRAINTS });
    return { ok: true, track: s.getVideoTracks()[0] };
  } catch (err) {
    return { ok: false, error: classifyMediaError(err) };
  }
}

function stopStream(stream) {
  if (!stream) return;
  for (const t of stream.getTracks()) {
    try {
      t.stop();
    } catch {
      /* already stopped */
    }
  }
}

// Restrict negotiated codecs to widely interoperable, well-tested ones. This uses
// the standard setCodecPreferences API (no SDP editing) and silently keeps the
// browser defaults if the API is missing or rejects the list.
function applyCodecPreferences(transceiver, kind) {
  try {
    if (typeof transceiver.setCodecPreferences !== 'function' || !RTCRtpReceiver.getCapabilities) return false;
    const caps = RTCRtpReceiver.getCapabilities(kind);
    if (!caps || !caps.codecs) return false;
    let keep;
    if (kind === 'audio') {
      const opus = caps.codecs.filter((c) => /^audio\/opus$/i.test(c.mimeType));
      const red = caps.codecs.filter((c) => /^audio\/red$/i.test(c.mimeType));
      keep = [...opus, ...red];
      if (opus.length === 0) return false;
    } else {
      const fmtp = (c) => c.sdpFmtpLine || '';
      const vp8 = caps.codecs.filter((c) => /^video\/VP8$/i.test(c.mimeType));
      const vp9 = caps.codecs.filter((c) => /^video\/VP9$/i.test(c.mimeType) && /profile-id=0|^$/.test(fmtp(c)));
      const h264 = caps.codecs.filter(
        (c) => /^video\/H264$/i.test(c.mimeType) && /packetization-mode=1/.test(fmtp(c)) && /profile-level-id=42e01f/i.test(fmtp(c)),
      );
      const rtx = caps.codecs.filter((c) => /^video\/rtx$/i.test(c.mimeType));
      if (vp8.length === 0) return false;
      keep = [...vp8, ...vp9, ...h264, ...rtx];
    }
    transceiver.setCodecPreferences(keep);
    return true;
  } catch {
    return false;
  }
}

// Audio first: give the voice stream priority and cap video so a weak uplink is
// not saturated by video at the expense of speech.
async function tuneSenders(audioSender, videoSender) {
  const apply = async (sender, fn) => {
    try {
      const p = sender.getParameters();
      if (!p.encodings || p.encodings.length === 0) return;
      fn(p.encodings[0]);
      await sender.setParameters(p);
    } catch {
      /* best effort: browser keeps its defaults */
    }
  };
  if (audioSender) {
    await apply(audioSender, (e) => {
      e.priority = 'high';
      e.networkPriority = 'high';
    });
  }
  if (videoSender) {
    await apply(videoSender, (e) => {
      e.maxBitrate = 1_500_000;
      e.priority = 'low';
    });
  }
}

// Microphone level meter for the preview ("is my mic working?"). Local only.
function createLevelMeter(stream, onLevel) {
  const track = stream && stream.getAudioTracks()[0];
  const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
  if (!track || !AC) return { stop() {} };
  let ctx;
  try {
    ctx = new AC();
  } catch {
    return { stop() {} };
  }
  const src = ctx.createMediaStreamSource(new MediaStream([track]));
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  src.connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  let raf = 0;
  let stopped = false;
  const tick = () => {
    if (stopped) return;
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    onLevel(Math.min(1, rms * 4));
    raf = requestAnimationFrame(tick);
  };
  ctx.resume().catch(() => {});
  raf = requestAnimationFrame(tick);
  return {
    stop() {
      stopped = true;
      cancelAnimationFrame(raf);
      try {
        src.disconnect();
      } catch {
        /* ignore */
      }
      ctx.close().catch(() => {});
    },
  };
}

// ---- session.js ----
// One call, from invitation to hang-up. Owns the RTCPeerConnection, the local
// media, all timers and all secret values, and releases every one of them in end().
//
// Session states:
//   idle -> preparing -> awaiting-reply (offerer) | reply-ready (answerer)
//        -> connecting -> connected -> ended
// Verification states (only meaningful once connected):
//   waiting (security values not exchanged yet) -> ready (code shown)
//        -> confirmed (user said the codes match)
//
// Outgoing media before confirmation: nothing. The microphone and camera tracks
// are not attached to their RTP senders (replaceTrack(null)), so no packets carry
// them. The user can open the microphone for a short window to read the code
// aloud (speakForCode), or explicitly choose to talk before checking.









const TIMEOUTS = {
  gatherSlowNotice: 4000, // tell the user gathering is taking a while
  speakWindow: 30000, // microphone window for reading the code aloud before confirming
  // Joining side, while waiting for the reply to be added: re-supply the other
  // side's addresses this often, so connectivity checks (and the router pinholes
  // they open) never lapse. Measured: without this, port-restricted home NATs
  // fail if the reply is added more than ~40 s after it was created.
  candidateRefresh: 15000,
  candidateRefreshMax: 15 * 60000,
  connect: 45000, // offerer: from adding the reply to a working connection
  reveal: 20000, // answerer: from channel open to receiving the security value
  disconnected: 30000, // how long a dropped connection may try to recover
  statsInterval: 2000,
};

// Invitation session IDs already used in this page (replay protection on the
// joining side; the starting side only ever accepts one reply for its own ID).
const usedInviteIds = new Set();

function inviteAlreadyUsed(sidText) {
  return usedInviteIds.has(sidText);
}

class CallSession {
  constructor({ role, iceConfig, emit }) {
    this.role = role; // 'offerer' | 'answerer'
    this.iceConfig = iceConfig;
    this._emit = emit || (() => {});
    this.state = 'idle';
    this.verify = 'waiting';
    this.mediaMode = 'video';
    this.pc = null;
    this.dc = null;
    this.localStream = null;
    this.audioTx = null;
    this.videoTx = null;
    this.remoteAudioStream = null;
    this.remoteVideoStream = null;
    this.micOn = true;
    this.cameraOn = false;
    this.allowUnverifiedVideo = false;
    this.allowUnverifiedAudio = false;
    this.speaking = false; // microphone opened only to read the code aloud
    this.speakUntil = 0;
    this._speakTimer = 0;
    this.remoteState = { mic: false, cam: false };
    this.remoteConfirmed = false;
    this.sid = null;
    this.nonceA = null;
    this.nonceB = null;
    this.commit = null;
    this.localFp = null;
    this.remoteFp = null;
    this.sas = null;
    this.certCheck = 'pending'; // pending | matched | unavailable | mismatch
    this.connectedAt = 0;
    this.localCandidates = [];
    this.remoteCandidates = [];
    this.candidateErrors = [];
    this.gatherResult = null; // { reason, ms }
    this._lastCandidateAt = 0;
    this._settledRelayUrls = new Set();
    this._urlAttribution = false;
    this.lastStats = null;
    this._prevLoss = null;
    this._timers = new Set();
    this._ended = false;
    this._wasDisconnected = false;
    this._disconnectTimer = 0;
  }

  emit(type, data) {
    try {
      this._emit(type, data, this);
    } catch (e) {
      console.error(e);
    }
  }

  // ---------- timers ----------
  _timeout(fn, ms) {
    const id = setTimeout(() => {
      this._timers.delete(id);
      fn();
    }, ms);
    this._timers.add(id);
    return id;
  }
  _clear(id) {
    if (!id) return;
    clearTimeout(id);
    clearInterval(id);
    this._timers.delete(id);
  }
  _interval(fn, ms) {
    const id = setInterval(fn, ms);
    this._timers.add(id);
    return id;
  }

  // ---------- media ----------
  async openMedia(wantVideo) {
    this.mediaMode = wantVideo ? 'video' : 'audio';
    const r = await openLocalMedia(wantVideo);
    if (this._ended) {
      if (r.ok) stopStream(r.stream);
      return { ok: false, error: 'cancelled' };
    }
    if (!r.ok) return r;
    this.localStream = r.stream;
    this.cameraOn = r.stream.getVideoTracks().length > 0;
    this.emit('local-media');
    return r;
  }

  get audioTrack() {
    return this.localStream ? this.localStream.getAudioTracks()[0] || null : null;
  }
  get videoTrack() {
    return this.localStream ? this.localStream.getVideoTracks()[0] || null : null;
  }

  // ---------- peer connection ----------
  async _createPeerConnection() {
    const cert = await RTCPeerConnection.generateCertificate({ name: 'ECDSA', namedCurve: 'P-256' });
    this._cert = cert;
    const pc = new RTCPeerConnection({ ...this.iceConfig, certificates: [cert] });
    this.pc = pc;
    pc.onicecandidate = (e) => {
      // Chromium reports the server on the candidate (RTCIceCandidate.url);
      // the event-level url is the older, deprecated location.
      this._noteServer((e.candidate && e.candidate.url) || e.url);
      if (e.candidate && e.candidate.candidate) {
        this._lastCandidateAt = Date.now();
        const m = /typ (host|srflx|prflx|relay)/.exec(e.candidate.candidate);
        this.localCandidates.push({
          type: m ? m[1] : 'unknown',
          protocol: (e.candidate.protocol || '').toLowerCase(),
          address: e.candidate.address || '',
        });
      }
    };
    pc.onicecandidateerror = (e) => {
      this._noteServer(e.url);
      if (this.candidateErrors.length < 10) {
        this.candidateErrors.push({ url: e.url || '', code: e.errorCode || 0 });
      }
    };
    const onState = () => this._onConnectionState();
    pc.onconnectionstatechange = onState;
    pc.oniceconnectionstatechange = onState;

    const dc = pc.createDataChannel('control', { negotiated: true, id: 0, ordered: true });
    this.dc = dc;
    dc.onopen = () => this._onChannelOpen();
    dc.onmessage = (e) => this._onControl(e.data);
    dc.onclose = () => {
      if (!this._ended && this.state === 'connected') {
        // The other side closed its connection (hung up, closed the tab, reloaded).
        this._timeout(() => this.end('remote-hangup'), 300);
      }
    };
    return pc;
  }

  _attachRemoteStreams() {
    this.remoteAudioStream = new MediaStream([this.audioTx.receiver.track]);
    this.remoteVideoStream = new MediaStream([this.videoTx.receiver.track]);
    this.emit('remote-media');
  }

  // Which ICE server produced a candidate or an error (Chromium reports this).
  _noteServer(url) {
    if (typeof url !== 'string' || !url) return;
    this._urlAttribution = true;
    this._settledRelayUrls.add(url);
  }

  _waitForGathering() {
    const pc = this.pc;
    const relayUrls = relayUrlsOf(this.iceConfig);
    return new Promise((resolve) => {
      const started = Date.now();
      this._lastCandidateAt = started;
      let done = false;
      let poll = 0;
      let slow = 0;
      const check = () => {
        if (done) return;
        if (this._ended || pc.signalingState === 'closed') return finish('closed');
        const now = Date.now();
        const d = gatherDecision({
          elapsedMs: now - started,
          msSinceLastCandidate: now - this._lastCandidateAt,
          complete: pc.iceGatheringState === 'complete',
          relayUrls,
          settledRelayUrls: this._settledRelayUrls,
          attribution: this._urlAttribution,
          haveRelayCandidate: this.localCandidates.some((c) => c.type === 'relay'),
        });
        if (d.done) finish(d.reason);
      };
      const finish = (reason) => {
        done = true;
        this._clear(poll);
        this._clear(slow);
        pc.removeEventListener('icegatheringstatechange', check);
        this.gatherResult = { reason, ms: Date.now() - started };
        resolve();
      };
      pc.addEventListener('icegatheringstatechange', check);
      poll = this._interval(check, 250);
      slow = this._timeout(() => {
        if (!done) this.emit('gathering-slow');
      }, TIMEOUTS.gatherSlowNotice);
      check();
    });
  }

  _checkLocalDescription(type) {
    const info = inspectSdp(this.pc.localDescription.sdp, type);
    if (!info.ok) throw Object.assign(new Error('local SDP rejected: ' + info.error), { code: 'internal' });
    // Without any network candidate the other side could never reach us; say so now
    // rather than after the person has sent the message.
    if (info.candidates.length === 0) {
      const relayOnly = this.iceConfig.iceTransportPolicy === 'relay';
      throw Object.assign(new Error('no candidates'), { code: relayOnly ? 'relay-unreachable' : 'no-network' });
    }
    // If the browser can tell us our certificate's fingerprint, it must be the one in our SDP.
    if (this._cert && typeof this._cert.getFingerprints === 'function') {
      const fps = this._cert.getFingerprints().map((f) => normalizeStatsFingerprint(f.algorithm, f.value));
      if (fps.length && !fps.includes(fingerprintString(info.fingerprint))) {
        throw Object.assign(new Error('certificate mismatch'), { code: 'internal' });
      }
    }
    this.localFp = info.fingerprint;
    return info;
  }

  // ---------- starting side ----------
  async createInvitation(introText) {
    if (this.state !== 'idle') throw new Error('bad state');
    this.state = 'preparing';
    const pc = await this._createPeerConnection();
    // Both senders start empty; tracks are attached only when allowed (see header).
    this.audioTx = pc.addTransceiver('audio', { direction: 'sendrecv' });
    this.videoTx = pc.addTransceiver('video', { direction: 'sendrecv' });
    applyCodecPreferences(this.audioTx, 'audio');
    applyCodecPreferences(this.videoTx, 'video');
    this._attachRemoteStreams();
    await pc.setLocalDescription();
    await this._waitForGathering();
    if (this._ended) return null;
    const info = this._checkLocalDescription('offer');

    this.sid = randomBytes(SIZES.SID_BYTES);
    this.nonceA = randomBytes(SIZES.NONCE_BYTES);
    this.commit = await makeCommit(this.sid, this.nonceA);
    const text = await encodeEnvelope(
      'invite',
      {
        v: PROTOCOL_VERSION,
        sid: base64urlEncode(this.sid),
        ts: Math.floor(Date.now() / 1000),
        media: this.mediaMode,
        commit: base64urlEncode(this.commit),
        sdp: pc.localDescription.sdp,
      },
      introText,
    );
    if (this._ended) return null;
    this.localSummary = summarizeCandidates(info.candidates);
    this.state = 'awaiting-reply';
    this.emit('state');
    return text;
  }

  // reply: output of protocol.parseReply()
  async acceptReply(reply) {
    if (this.role !== 'offerer' || this.state !== 'awaiting-reply') return { ok: false, error: 'reply-unexpected' };
    if (!bytesEqual(reply.sid, this.sid)) return { ok: false, error: 'reply-mismatch' };
    this.state = 'connecting';
    this.nonceB = reply.nb;
    this.remoteFp = reply.sdpInfo.fingerprint;
    this.remoteCandidates = reply.sdpInfo.candidates;
    this.emit('state');
    try {
      await this.pc.setRemoteDescription({ type: 'answer', sdp: reply.sdp });
    } catch (e) {
      this.end('connect-failed', { cause: 'remote-description' });
      return { ok: false, error: 'reply-invalid' };
    }
    this._connectTimer = this._timeout(() => {
      if (this.state !== 'connected') this.end('connect-failed', { cause: 'timeout' });
    }, TIMEOUTS.connect);
    return { ok: true };
  }

  // ---------- joining side ----------
  // invite: output of protocol.parseInvite()
  async acceptInvitation(invite, introText) {
    if (this.state !== 'idle') throw new Error('bad state');
    if (usedInviteIds.has(invite.sidText)) return { ok: false, error: 'replay' };
    usedInviteIds.add(invite.sidText);
    this.state = 'preparing';
    this.sid = invite.sid;
    this.commit = invite.commit;
    this.remoteFp = invite.sdpInfo.fingerprint;
    this.remoteCandidates = invite.sdpInfo.candidates;
    this.mediaMode = invite.media;

    const pc = await this._createPeerConnection();
    // The offer's candidates are supplied separately (standard trickle API) so that
    // they can be re-supplied while we wait; see _refreshRemoteCandidates().
    const split = splitCandidates(invite.sdp);
    this._remoteIce = split.candidates;
    try {
      await pc.setRemoteDescription({ type: 'offer', sdp: split.sdp });
    } catch {
      // Passed our structural checks but the browser's WebRTC engine refused it.
      this.end('internal', { silent: true });
      return { ok: false, error: 'invalid' };
    }
    const txs = pc.getTransceivers();
    this.audioTx = txs.find((t) => t.receiver.track.kind === 'audio');
    this.videoTx = txs.find((t) => t.receiver.track.kind === 'video');
    if (!this.audioTx || !this.videoTx) {
      this.end('internal', { silent: true });
      return { ok: false, error: 'invalid' };
    }
    this.audioTx.direction = 'sendrecv';
    this.videoTx.direction = 'sendrecv';
    applyCodecPreferences(this.audioTx, 'audio');
    applyCodecPreferences(this.videoTx, 'video');
    this._attachRemoteStreams();
    await pc.setLocalDescription();
    await this._waitForGathering();
    if (this._ended) return { ok: false, error: 'cancelled' };
    const info = this._checkLocalDescription('answer');

    this.nonceB = randomBytes(SIZES.NONCE_BYTES);
    const text = await encodeEnvelope(
      'reply',
      {
        v: PROTOCOL_VERSION,
        sid: base64urlEncode(this.sid),
        ts: Math.floor(Date.now() / 1000),
        nb: base64urlEncode(this.nonceB),
        sdp: pc.localDescription.sdp,
      },
      introText,
    );
    if (this._ended) return { ok: false, error: 'cancelled' };
    this.localSummary = summarizeCandidates(info.candidates);
    this.state = 'reply-ready';
    this.emit('state');
    this._refreshRemoteCandidates(0);
    return { ok: true, text };
  }

  // Supply the other side's candidates; then, until connected, supply them again
  // every TIMEOUTS.candidateRefresh under fresh foundations. Each round restarts
  // connectivity checks toward the same addresses (nothing new is revealed).
  async _refreshRemoteCandidates(round) {
    if (this._ended || this.state === 'connected' || !this.pc) return;
    for (const c of this._remoteIce || []) {
      try {
        await this.pc.addIceCandidate({ candidate: round === 0 ? c.candidate : refreshFoundation(c.candidate, round), sdpMid: c.sdpMid });
      } catch {
        /* a candidate the browser cannot use (e.g. unresolvable name) */
      }
      if (this._ended || !this.pc) return;
    }
    if (round === 0) this._refreshStarted = Date.now();
    if (Date.now() - this._refreshStarted >= TIMEOUTS.candidateRefreshMax) {
      this.emit('path-trouble');
      return;
    }
    this._refreshTimer = this._timeout(() => this._refreshRemoteCandidates(round + 1), TIMEOUTS.candidateRefresh);
  }

  // ---------- connection lifecycle ----------
  _connState() {
    const pc = this.pc;
    if (!pc) return 'closed';
    if (pc.connectionState) return pc.connectionState;
    const ice = pc.iceConnectionState;
    return ice === 'completed' ? 'connected' : ice === 'checking' ? 'connecting' : ice;
  }

  _onConnectionState() {
    if (this._ended) return;
    const s = this._connState();
    if (s === 'connected') {
      if (!this.connectedAt) this._onConnected();
      else if (this._wasDisconnected) {
        this._wasDisconnected = false;
        this._clear(this._disconnectTimer);
        this.emit('stable');
      }
    } else if (s === 'disconnected') {
      if (this.connectedAt && !this._wasDisconnected) {
        this._wasDisconnected = true;
        this.emit('unstable');
        this._disconnectTimer = this._timeout(() => {
          if (this._connState() !== 'connected') this.end('connection-lost');
        }, TIMEOUTS.disconnected);
      }
    } else if (s === 'failed') {
      // Before the first connection, "failed" is not final in practice: checks
      // restart (the joining side re-supplies candidates) and browsers recover.
      // The offerer's connect timer and the refresh limit decide when to give up.
      if (this.connectedAt) this.end('connection-lost');
    }
  }

  _onConnected() {
    this.connectedAt = Date.now();
    this.state = 'connected';
    this._clear(this._connectTimer);
    this.emit('connected');
    this._checkCertificates();
    tuneSenders(this.audioTx.sender, this.videoTx.sender);
    this._statsTimer = this._interval(() => this._sampleStats(), TIMEOUTS.statsInterval);
    this._sampleStats();
  }

  // Defence in depth: compare the certificates the browser actually used in the
  // DTLS handshake (from getStats) with the fingerprints the code is computed over.
  // Browsers already enforce this match; if they ever didn't, we end the call.
  async _checkCertificates() {
    for (let attempt = 0; attempt < 4 && !this._ended; attempt++) {
      let report;
      try {
        report = await this.pc.getStats();
      } catch {
        break;
      }
      let transport = null;
      report.forEach((s) => {
        if (s.type === 'transport' && s.remoteCertificateId) transport = s;
      });
      if (transport) {
        const local = report.get(transport.localCertificateId);
        const remote = report.get(transport.remoteCertificateId);
        if (local && remote) {
          const okLocal = normalizeStatsFingerprint(local.fingerprintAlgorithm, local.fingerprint) === fingerprintString(this.localFp);
          const okRemote = normalizeStatsFingerprint(remote.fingerprintAlgorithm, remote.fingerprint) === fingerprintString(this.remoteFp);
          if (okLocal && okRemote) {
            this.certCheck = 'matched';
            this.emit('cert-check');
            return;
          }
          this.certCheck = 'mismatch';
          this.end('security-failed', { cause: 'certificate' });
          return;
        }
      }
      await new Promise((r) => this._timeout(r, 500));
    }
    if (!this._ended) {
      this.certCheck = 'unavailable';
      this.emit('cert-check');
    }
  }

  _send(obj) {
    if (this.dc && this.dc.readyState === 'open') {
      try {
        this.dc.send(JSON.stringify(obj));
      } catch {
        /* channel closing */
      }
    }
  }

  async _onChannelOpen() {
    if (this._ended) return;
    this._sendState();
    if (this.role === 'offerer') {
      // The DTLS handshake has completed, so the certificates are now fixed and
      // it is safe to reveal the value we committed to in the invitation.
      this._send({ t: 'reveal', na: base64urlEncode(this.nonceA) });
      await this._computeSas();
    } else {
      this._revealTimer = this._timeout(() => {
        if (!this.sas) this.end('security-failed', { cause: 'no-reveal' });
      }, TIMEOUTS.reveal);
    }
  }

  async _onControl(data) {
    if (this._ended) return;
    const m = parseControl(data);
    if (!m) return;
    switch (m.t) {
      case 'reveal':
        if (this.role !== 'answerer' || this.nonceA || this.sas) return;
        if (!(await checkCommit(this.sid, m.na, this.commit))) {
          this.end('security-failed', { cause: 'commit' });
          return;
        }
        this.nonceA = m.na;
        this._clear(this._revealTimer);
        await this._computeSas();
        break;
      case 'state':
        this.remoteState = { mic: m.mic, cam: m.cam };
        this.emit('remote-state');
        break;
      case 'confirmed':
        this.remoteConfirmed = true;
        this.emit('remote-confirmed');
        break;
      case 'bye':
        this.end('remote-hangup');
        break;
      default:
    }
  }

  async _computeSas() {
    const offerer = this.role === 'offerer';
    const code = await deriveSas({
      sid: this.sid,
      offerFingerprint: offerer ? this.localFp : this.remoteFp,
      answerFingerprint: offerer ? this.remoteFp : this.localFp,
      nonceA: this.nonceA,
      nonceB: this.nonceB,
    });
    if (this._ended) return;
    this.sas = code;
    this.verify = 'ready';
    this.emit('sas', code);
  }

  confirmCode() {
    if (this.verify !== 'ready' || this._ended) return;
    this.verify = 'confirmed';
    this._clear(this._speakTimer);
    this.speaking = false;
    this._send({ t: 'confirmed' });
    this._syncAudioSender();
    this._syncVideoSender();
    this.emit('verified');
  }

  rejectCode() {
    this.end('code-mismatch');
  }

  // ---------- local controls ----------
  get videoAllowed() {
    return this.verify === 'confirmed' || this.allowUnverifiedVideo;
  }

  get audioAllowed() {
    return this.verify === 'confirmed' || this.allowUnverifiedAudio || this.speaking;
  }

  get sendingAudio() {
    return !!(this.audioTx && this.audioTx.sender.track && this.micOn);
  }

  async _syncAudioSender() {
    if (!this.audioTx || this._ended) return;
    const want = this.audioAllowed ? this.audioTrack : null;
    if (this.audioTx.sender.track !== want) {
      try {
        await this.audioTx.sender.replaceTrack(want);
      } catch (e) {
        console.warn('replaceTrack failed', e);
      }
    }
    this._sendState();
    this.emit('local-media');
  }

  // Open the microphone for a short window, only to read the code aloud.
  speakForCode(on) {
    if (this._ended || this.state !== 'connected' || this.verify === 'confirmed') return;
    this._clear(this._speakTimer);
    this.speaking = !!on;
    this.speakUntil = on ? Date.now() + TIMEOUTS.speakWindow : 0;
    if (on) {
      if (!this.micOn) this.setMic(true);
      this._speakTimer = this._timeout(() => this.speakForCode(false), TIMEOUTS.speakWindow);
    }
    this._syncAudioSender();
  }

  // The user chose to talk before checking the code (after a warning).
  allowTalkUnverified() {
    if (this._ended) return;
    this.allowUnverifiedAudio = true;
    this._clear(this._speakTimer);
    this.speaking = false;
    this._syncAudioSender();
  }

  get sendingVideo() {
    return !!(this.videoTx && this.videoTx.sender.track);
  }

  async _syncVideoSender() {
    if (!this.videoTx || this._ended) return;
    const want = this.cameraOn && this.videoAllowed ? this.videoTrack : null;
    if (this.videoTx.sender.track !== want) {
      try {
        await this.videoTx.sender.replaceTrack(want);
      } catch (e) {
        console.warn('replaceTrack failed', e);
      }
    }
    this._sendState();
    this.emit('local-media');
  }

  _sendState() {
    this._send({ t: 'state', mic: this.sendingAudio, cam: this.sendingVideo });
  }

  setMic(on) {
    this.micOn = !!on;
    const t = this.audioTrack;
    if (t) t.enabled = this.micOn;
    this._sendState();
    this.emit('local-media');
  }

  async setCamera(on, { allowUnverified = false } = {}) {
    if (this._ended) return { ok: false };
    if (allowUnverified) this.allowUnverifiedVideo = true;
    if (on) {
      if (!this.videoTrack) {
        const r = await openCamera();
        if (this._ended) {
          if (r.ok) r.track.stop();
          return { ok: false };
        }
        if (!r.ok) return r;
        this.localStream.addTrack(r.track);
      }
      this.cameraOn = true;
    } else {
      this.cameraOn = false;
      const t = this.videoTrack;
      if (t) {
        // Stop the device (camera light goes off), not just disable the track.
        if (this.videoTx) {
          try {
            await this.videoTx.sender.replaceTrack(null);
          } catch {
            /* ignore */
          }
        }
        t.stop();
        this.localStream.removeTrack(t);
      }
    }
    await this._syncVideoSender();
    return { ok: true };
  }

  // ---------- statistics ----------
  async _sampleStats() {
    if (this._ended || !this.pc) return;
    let report;
    try {
      report = await this.pc.getStats();
    } catch {
      return;
    }
    if (this._ended) return;
    let transport = null;
    let pair = null;
    const s = { at: Date.now() };
    report.forEach((r) => {
      if (r.type === 'transport' && !transport) transport = r;
      if (r.type === 'candidate-pair' && (r.selected || (r.nominated && r.state === 'succeeded')) && !pair) pair = r;
      if (r.type === 'inbound-rtp' && r.kind === 'audio') s.inAudio = r;
      if (r.type === 'inbound-rtp' && r.kind === 'video') s.inVideo = r;
      if (r.type === 'outbound-rtp' && r.kind === 'video') s.outVideo = r;
      if (r.type === 'outbound-rtp' && r.kind === 'audio') s.outAudio = r;
    });
    if (transport && transport.selectedCandidatePairId) pair = report.get(transport.selectedCandidatePairId) || pair;
    const summary = {
      rtt: pair && typeof pair.currentRoundTripTime === 'number' ? pair.currentRoundTripTime : null,
      outgoingBitrate: pair && pair.availableOutgoingBitrate ? pair.availableOutgoingBitrate : null,
      path: null,
      protocol: null,
      loss: null,
      srtpCipher: transport ? transport.srtpCipher || null : null,
      dtlsCipher: transport ? transport.dtlsCipher || null : null,
      tlsVersion: transport ? transport.tlsVersion || null : null,
      inVideo: null,
      outVideo: null,
      audioBytesReceived: s.inAudio ? s.inAudio.bytesReceived || 0 : 0,
      audioBytesSent: s.outAudio ? s.outAudio.bytesSent || 0 : 0,
      videoFramesDecoded: s.inVideo ? s.inVideo.framesDecoded || 0 : 0,
      videoFramesSent: s.outVideo ? s.outVideo.framesSent || s.outVideo.framesEncoded || 0 : 0,
    };
    if (pair) {
      const lc = report.get(pair.localCandidateId);
      const rc = report.get(pair.remoteCandidateId);
      if (lc && rc) {
        summary.path = lc.candidateType === 'relay' || rc.candidateType === 'relay' ? 'relay' : 'direct';
        summary.protocol = (lc.relayProtocol || lc.protocol || '').toLowerCase();
        summary.localType = lc.candidateType;
        summary.remoteType = rc.candidateType;
      }
    }
    if (s.inAudio) {
      // Receive-side audio buffering over the last interval (jitter buffer).
      const jbDelay = s.inAudio.jitterBufferDelay;
      const jbCount = s.inAudio.jitterBufferEmittedCount;
      if (typeof jbDelay === 'number' && typeof jbCount === 'number') {
        const prev = this._prevJb;
        if (prev && jbCount > prev.count) summary.audioBufferMs = (1000 * (jbDelay - prev.delay)) / (jbCount - prev.count);
        this._prevJb = { delay: jbDelay, count: jbCount };
      }
      const codec = s.inAudio.codecId ? report.get(s.inAudio.codecId) : null;
      if (codec && codec.mimeType) summary.audioCodec = codec.mimeType.replace(/^audio\//i, '');
      const lost = s.inAudio.packetsLost || 0;
      const recv = s.inAudio.packetsReceived || 0;
      if (this._prevLoss) {
        const dl = lost - this._prevLoss.lost;
        const dr = recv - this._prevLoss.recv;
        summary.loss = dl + dr > 0 ? Math.max(0, dl) / (Math.max(0, dl) + dr) : 0;
      }
      this._prevLoss = { lost, recv };
    }
    if (s.inVideo && s.inVideo.frameHeight) {
      summary.inVideo = { w: s.inVideo.frameWidth, h: s.inVideo.frameHeight, fps: s.inVideo.framesPerSecond || null };
    }
    if (s.outVideo && s.outVideo.frameHeight && this.sendingVideo) {
      summary.outVideo = {
        w: s.outVideo.frameWidth,
        h: s.outVideo.frameHeight,
        fps: s.outVideo.framesPerSecond || null,
        limit: s.outVideo.qualityLimitationReason || null,
      };
    }
    summary.quality = rateQuality(summary.rtt, summary.loss);
    this.lastStats = summary;
    this.emit('stats', summary);
  }

  diagnostics() {
    return {
      local: this.localSummary || summarizeCandidates([]),
      remote: summarizeCandidates(this.remoteCandidates),
      candidateErrors: this.candidateErrors.slice(),
      iceState: this.pc ? this.pc.iceConnectionState : 'closed',
      relayOnly: this.iceConfig.iceTransportPolicy === 'relay',
    };
  }

  // ---------- teardown ----------
  end(reason, detail = {}) {
    if (this._ended) return;
    this._ended = true;
    const duration = this.connectedAt ? Date.now() - this.connectedAt : 0;
    const diagnostics = this.diagnostics();
    const tellRemote = ['local-hangup', 'code-mismatch', 'page-closed', 'security-failed'];
    if (tellRemote.includes(reason)) this._send({ t: 'bye' });
    for (const id of this._timers) {
      clearTimeout(id);
      clearInterval(id);
    }
    this._timers.clear();
    if (this.dc) {
      this.dc.onopen = this.dc.onmessage = this.dc.onclose = null;
      try {
        this.dc.close();
      } catch {
        /* ignore */
      }
    }
    if (this.pc) {
      const pc = this.pc;
      pc.onicecandidate = pc.onicecandidateerror = pc.onconnectionstatechange = pc.oniceconnectionstatechange = null;
      try {
        pc.close();
      } catch {
        /* ignore */
      }
    }
    stopStream(this.localStream);
    stopStream(this.remoteAudioStream);
    stopStream(this.remoteVideoStream);
    wipe(this.nonceA);
    wipe(this.nonceB);
    wipe(this.sid);
    this.nonceA = this.nonceB = this.commit = null;
    this.sas = null;
    this._cert = null;
    this.dc = null;
    this.pc = null;
    this.state = 'ended';
    this.emit('ended', { reason, detail, duration, diagnostics });
  }
}

function rateQuality(rtt, loss) {
  if (rtt == null && loss == null) return 'unknown';
  const r = rtt == null ? 0 : rtt;
  const l = loss == null ? 0 : loss;
  if (r < 0.3 && l < 0.02) return 'good';
  if (r < 0.6 && l < 0.08) return 'fair';
  return 'poor';
}

const LOCALES = {
  en: { name: 'English', dir: 'ltr', strings: EN },
};

let current = 'en';

function setLocale(code) {
  if (LOCALES[code]) current = code;
  const doc = globalThis.document;
  if (doc) {
    doc.documentElement.lang = code;
    doc.documentElement.dir = LOCALES[current].dir;
  }
}

function getLocale() {
  return current;
}

function t(key, vars) {
  const table = LOCALES[current].strings;
  let s = Object.prototype.hasOwnProperty.call(table, key) ? table[key] : EN[key];
  if (s === undefined) s = key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? String(vars[k]) : m));
  return s;
}

// Digits in the user's numbering system (e.g. Persian digits for "fa").
function localDigits(str) {
  let fmt;
  try {
    fmt = new Intl.NumberFormat(current, { useGrouping: false });
  } catch {
    return str;
  }
  return String(str).replace(/\d/g, (d) => fmt.format(Number(d)));
}

// Apply translations to static markup: data-i18n (text), data-i18n-aria (aria-label),
// data-i18n-title (title), data-i18n-placeholder (placeholder).
function translateDom(root) {
  for (const el of root.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of root.querySelectorAll('[data-i18n-aria]')) el.setAttribute('aria-label', t(el.dataset.i18nAria));
  for (const el of root.querySelectorAll('[data-i18n-title]')) el.setAttribute('title', t(el.dataset.i18nTitle));
  for (const el of root.querySelectorAll('[data-i18n-placeholder]')) el.setAttribute('placeholder', t(el.dataset.i18nPlaceholder));
}
